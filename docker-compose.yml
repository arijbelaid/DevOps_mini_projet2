services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ChangeMe-123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./app/backend      # <-- Le chemin est corrigé ici
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: ChangeMe-123
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./app/frontend     # <-- Le chemin est corrigé ici
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata: