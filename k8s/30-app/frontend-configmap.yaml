apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
data:
  default.conf: |
    server {
        listen 8080;
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
        location /api/ {
            proxy_pass http://api-svc:8000/;
            proxy_set_header Host $host;
        }
    }
